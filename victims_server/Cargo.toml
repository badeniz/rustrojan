[package]
name = "victims_server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
axum = "0.8.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fake = "5.1.0"
uuid = { version = "1.8", features = ["v4"] }



